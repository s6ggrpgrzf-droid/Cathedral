<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cathedral — Old Time Radio</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    min-height:100dvh; color:#efe3c8;
    font-family:Georgia, 'Times New Roman', serif;
    /* the parlor */
    background:
      radial-gradient(80% 50% at 50% 30%, rgba(255,205,130,.13) 0%, transparent 60%),
      radial-gradient(95% 65% at 50% 32%, #33200f 0%, #170d06 58%, #0a0503 100%),
      #0a0503;
    padding:30px 16px 44px;
    transition:background 1.6s ease;
  }
  body.listening{background:
      radial-gradient(80% 50% at 50% 30%, rgba(255,205,130,.06) 0%, transparent 60%),
      radial-gradient(95% 65% at 50% 32%, #1e1207 0%, #0e0704 58%, #050302 100%),
      #050302;}
  body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
    background:radial-gradient(120% 100% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
    opacity:0; transition:opacity 1.6s ease;}
  body.listening::after{opacity:1;}

  .stage{max-width:560px; margin:0 auto; position:relative; z-index:2;}

  .site-title{text-align:center; margin:2px 0 4px; font-size:15px; letter-spacing:6px;
    color:#c8a45e; text-transform:uppercase; font-weight:400;}
  .site-sub{text-align:center; margin:0 0 24px; font-size:13.5px; color:#8a755a; font-style:italic;}

  /* ============ THE CATHEDRAL RADIO ============ */
  .radio{
    position:relative; margin:0 auto; max-width:480px;
    border-radius:240px 240px 18px 18px / 200px 200px 18px 18px;
    padding:34px 30px 26px;
    background:
      linear-gradient(180deg, rgba(255,220,160,.10), rgba(255,220,160,0) 20%),
      radial-gradient(ellipse 34px 48px at 20% 38%, rgba(18,9,4,.28), transparent 70%),
      repeating-linear-gradient(91deg, rgba(14,7,3,.16) 0 2px, rgba(255,205,145,.05) 2px 4px, transparent 4px 12px),
      repeating-linear-gradient(89deg, transparent 0 78px, rgba(0,0,0,.12) 78px 81px, transparent 81px 160px),
      linear-gradient(180deg,#54341a 0%,#3b2210 50%,#241305 100%);
    border:2px solid #1d0f05;
    box-shadow:
      0 30px 70px rgba(0,0,0,.7),
      0 8px 22px rgba(0,0,0,.5),
      0 0 80px 8px rgba(255,190,110,0),
      inset 0 2px 0 rgba(255,235,185,.30),
      inset 0 -6px 16px rgba(0,0,0,.55),
      inset 3px 0 0 rgba(255,220,170,.08),
      inset -3px 0 0 rgba(0,0,0,.4);
    transition:box-shadow 1.6s ease;
  }
  body.listening .radio{
    box-shadow:
      0 30px 70px rgba(0,0,0,.7),
      0 8px 22px rgba(0,0,0,.5),
      0 0 80px 8px rgba(255,190,110,.14),
      inset 0 2px 0 rgba(255,235,185,.30),
      inset 0 -6px 16px rgba(0,0,0,.55),
      inset 3px 0 0 rgba(255,220,170,.08),
      inset -3px 0 0 rgba(0,0,0,.4);
  }
  /* arch inset panel */
  .radio::before{content:""; position:absolute; inset:12px;
    border-radius:230px 230px 12px 12px / 190px 190px 12px 12px;
    border:2px solid rgba(20,10,4,.55);
    box-shadow:inset 0 1px 0 rgba(255,225,175,.14);
    pointer-events:none;}

  /* ---- the dial ---- */
  .dial{
    position:relative; border-radius:12px; padding:14px 16px 10px; margin-bottom:18px;
    background:
      radial-gradient(120% 160% at 50% 0%, rgba(255,190,100,.20), transparent 60%),
      linear-gradient(180deg,#2a1a0c,#1a0f06);
    border:2px solid #0f0803;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.85), inset 0 0 30px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .dial-glass{
    position:relative; border-radius:6px; padding:10px 6px 8px;
    background:linear-gradient(180deg,#f7c56a 0%,#e8a83e 55%,#c9822a 100%);
    box-shadow:inset 0 0 22px rgba(120,60,0,.55), inset 0 2px 6px rgba(255,255,255,.35);
    opacity:.42; transition:opacity 2.4s ease, box-shadow 2.4s ease;
  }
  .dial.on .dial-glass{opacity:1;
    box-shadow:inset 0 0 22px rgba(120,60,0,.55), inset 0 2px 6px rgba(255,255,255,.35),
      0 0 26px rgba(255,180,80,.45);}
  .dial-band{position:relative; height:58px;}
  .dial-labels{position:absolute; inset:0;}
  .dial-labels span{
    position:absolute; transform:translate(-50%,-50%);
    font-size:8.5px; font-weight:700; letter-spacing:.4px; color:#4a2c08;
    text-align:center; width:58px; line-height:1.25; white-space:normal;
  }
  .dial-ticks{position:absolute; left:4px; right:4px; bottom:2px; height:8px;
    background:repeating-linear-gradient(90deg, rgba(74,44,8,.65) 0 1px, transparent 1px 10%);}
  .needle{
    position:absolute; top:-4px; bottom:-4px; width:2.5px; left:5%;
    background:#a01818; border-radius:2px;
    box-shadow:0 0 6px rgba(160,24,24,.8), 0 0 2px rgba(0,0,0,.5);
    transition:left .8s cubic-bezier(.6,0,.3,1);
  }
  .dial-status{
    text-align:center; margin-top:9px; min-height:20px;
    font-size:13px; font-style:italic; color:#ffe1a0; letter-spacing:.4px;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
  }

  /* ---- speaker grille ---- */
  .grille{
    position:relative; border-radius:10px; height:150px; margin-bottom:20px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.0) 0 13px, rgba(16,8,3,.85) 13px 19px),
      repeating-linear-gradient(0deg, rgba(255,220,170,.03) 0 3px, transparent 3px 6px),
      linear-gradient(180deg,#5a3c1e,#3d2712);
    border:2px solid rgba(16,8,3,.8);
    box-shadow:inset 0 3px 14px rgba(0,0,0,.75), inset 0 0 34px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .grille::after{content:""; position:absolute; inset:0;
    background:
      radial-gradient(60% 90% at 50% 50%, transparent 60%, rgba(0,0,0,.4) 100%);}
  .grille-arch{
    position:absolute; left:50%; top:12px; transform:translateX(-50%);
    width:120px; height:120px; border-radius:60px 60px 8px 8px;
    border:3px solid rgba(16,8,3,.55);
    box-shadow:inset 0 0 18px rgba(0,0,0,.5);
  }

  /* ---- controls ---- */
  .controls{display:flex; justify-content:space-between; align-items:flex-end; gap:10px;}
  .knob-unit{display:flex; flex-direction:column; align-items:center; gap:7px;}
  .knob-unit label{font-size:9.5px; letter-spacing:2.5px; text-transform:uppercase; color:#b09a78; font-weight:700;}
  .knob{
    width:64px; height:64px; border-radius:50%; border:none; cursor:pointer; position:relative;
    background:
      radial-gradient(circle at 34% 30%, #6a4a28 0%, #41301a 55%, #241708 100%);
    box-shadow:
      0 5px 12px rgba(0,0,0,.65),
      inset 0 2px 3px rgba(255,235,200,.35),
      inset 0 -4px 8px rgba(0,0,0,.6);
    touch-action:none;
  }
  .knob::after{content:""; position:absolute; inset:7px; border-radius:50%;
    border:2px dashed rgba(255,235,200,.14);}
  .knob .ptr{position:absolute; inset:0; transition:transform .18s ease;}
  .knob .ptr::before{content:""; position:absolute; left:50%; top:6px; width:5px; height:15px;
    margin-left:-2.5px; border-radius:3px; background:#f2d492;
    box-shadow:0 0 5px rgba(0,0,0,.6);}
  .power-col{display:flex; flex-direction:column; align-items:center; gap:7px;}
  .power{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    padding:9px 16px; border-radius:999px; border:1px solid #120a04;
    background:linear-gradient(180deg,#2c1c0e,#1a0f06); color:#e8d5ae;
    font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:700; font-family:inherit;
    box-shadow:inset 0 1px 0 rgba(255,230,180,.2), 0 3px 8px rgba(0,0,0,.5);
  }
  .power .led{width:8px; height:8px; border-radius:50%; background:#3a2c1a; flex:none;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.8); transition:all .3s ease;}
  .power.on .led{background:#ffb347; box-shadow:0 0 9px rgba(255,180,80,.9), inset 0 0 2px rgba(255,255,255,.6);}

  /* nameplate */
  .nameplate{text-align:center; margin-top:16px;}
  .nameplate span{display:inline-block; padding:5px 18px 4px; border-radius:3px;
    background:linear-gradient(180deg,#c8a04a,#8a6a2f); color:#2a1c08;
    font-size:12px; letter-spacing:5px; font-weight:700;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 6px rgba(0,0,0,.5);}

  footer{margin:28px auto 0; max-width:520px; text-align:center;
    font-size:12.5px; line-height:1.9; color:#8a755a;}
  footer a{color:#c8a45e;}

  @media (max-width:640px){
    .radio{padding:26px 18px 20px;}
    .knob{width:58px; height:58px;}
    .dial-labels span{font-size:8.5px; width:52px;}
    .grille{height:120px;}
  }
  @media (prefers-reduced-motion:reduce){
    .needle{transition:none;}
    .dial-glass{transition:none;}
  }
</style>
</head>
<body>
<main class="stage">
  <h1 class="site-title">Cathedral</h1>
  <p class="site-sub">Old time radio, the way it was heard.</p>

  <div class="radio" id="radio">
    <div class="dial" id="dial">
      <div class="dial-glass">
        <div class="dial-band">
          <div class="dial-labels" id="dialLabels"></div>
          <div class="dial-ticks" aria-hidden="true"></div>
          <div class="needle" id="needle" aria-hidden="true"></div>
        </div>
      </div>
      <div class="dial-status" id="dialStatus">The set is dark. Turn it on.</div>
    </div>

    <div class="grille" aria-hidden="true"><div class="grille-arch"></div></div>

    <div class="controls">
      <div class="knob-unit">
        <button class="knob" id="knobTune" aria-label="Tune to the next station"><span class="ptr" id="tunePtr"></span></button>
        <label>Tuning</label>
      </div>
      <div class="power-col">
        <button class="power" id="btnPower" aria-label="Power"><span class="led"></span>Power</button>
      </div>
      <div class="knob-unit">
        <button class="knob" id="knobVol" aria-label="Volume (drag or tap to mute)"><span class="ptr" id="volPtr"></span></button>
        <label>Volume</label>
      </div>
    </div>

    <div class="nameplate"><span>CATHEDRAL</span></div>
  </div>

  <footer>
    Broadcasts stream free from the <a href="https://archive.org" target="_blank" rel="noopener">Internet Archive</a>,
    preserved by the Old Time Radio Researchers.<br>
    Turn the tuning knob. See what's on the air tonight.
  </footer>
</main>

<audio id="player" preload="none"></audio>
<script src="app.js?v=1"></script>
</body>
</html>
